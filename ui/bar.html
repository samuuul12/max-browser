<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="bar.css">
    <script src="qwebchannel.js"></script>
</head>
<body>
    <div class="topbar-container">
        <!-- Tabs Row -->
        <div class="tabs-row">
            <div class="tabs-list" id="tabs-list">
                <!-- Tabs will be rendered here dynamically -->
            </div>
            <button class="new-tab-btn" id="new-tab-btn" title="Nova Guia">
                <svg viewBox="0 0 24 24" class="tab-btn-icon">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                </svg>
            </button>
            <div class="window-drag-area"></div>
        </div>

        <!-- Controls Row -->
        <div class="controls-row">
            <div class="nav-buttons">
                <button class="nav-btn" id="back-btn" title="Voltar">
                    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                </button>
                <button class="nav-btn" id="forward-btn" title="Avançar">
                    <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8-8-8z"/></svg>
                </button>
                <button class="nav-btn" id="reload-btn" title="Recarregar">
                    <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                </button>
                <button class="nav-btn" id="home-btn" title="Página Inicial">
                    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                </button>
            </div>

            <!-- Address Bar -->
            <div class="address-container">
                <div class="security-badge" id="security-badge">
                    <svg viewBox="0 0 24 24" id="lock-icon" class="lock-icon"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                </div>
                <input type="text" id="address-input" placeholder="Pesquisar ou digitar endereço..." autocomplete="off">
                <button class="address-btn" id="bookmark-btn" title="Favoritar esta página">
                    <svg viewBox="0 0 24 24" id="star-icon"><path d="M22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03z"/></svg>
                </button>
            </div>

            <!-- Options/Settings Button -->
            <button class="nav-btn" id="settings-btn" title="Configurações">
                <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </button>
        </div>
    </div>

    <script src="bar.js"></script>
</body>
</html>
